name: Setup
description: Install pnpm, Node.js with cache, project dependencies and generate the Prisma client.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    - run: pnpm prisma generate
      shell: bash
